
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE ALERT | QR Generator</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">LINE ALERT</a>
            <span class="navbar-text">Counter QR Generator</span>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">

                <div class="queue-card text-center">
                    <h2 class="fw-bold mb-2">Generate Counter QR</h2>
                    <p class="text-muted mb-4">
                        Create a QR code that directs customers to your queue.
                    </p>

                    <form id="qrForm" class="text-start">

                        <div class="mb-3">
                            <label for="counterName" class="form-label">
                                Counter Name
                            </label>
                            <input
                                type="text"
                                id="counterName"
                                class="form-control"
                                placeholder="e.g. Canteen Counter"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="counterId" class="form-label">
                                Counter ID
                            </label>
                            <input
                                type="text"
                                id="counterId"
                                class="form-control"
                                placeholder="e.g. CANTEEN01"
                                required
                            >
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Generate QR Code
                        </button>
                    </form>

                    <div id="qrResult" class="mt-4" hidden>
                        <h5 id="generatedCounterName"></h5>

                        <div
                            id="qrCode"
                            class="d-flex justify-content-center my-3"
                        ></div>

                        <p class="small text-muted">
                            Scan this code to open the customer queue page.
                        </p>

                        <p id="generatedUrl" class="small text-break"></p>

                        <button
                            type="button"
                            id="downloadQR"
                            class="btn btn-outline-primary"
                        >
                            Download QR Code
                        </button>
                    </div>

                    <p id="qrMessage" class="mt-3" role="status"></p>
                </div>

            </div>
        </div>
    </main>

    <!-- QRCode.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Your QR module -->
    <script src="js/qr.js"></script>

</body>
</html>
